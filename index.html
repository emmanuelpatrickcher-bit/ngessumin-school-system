<script>

const SUPABASE_URL =
  "https://awazhdqlkjscfrhsoghe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_87J_ACo3RI__1dzCFH1I8A_vml3ngIh";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let grades = [];
let learners = [];
let areas = [];


/* ================= START ================= */

document.addEventListener("DOMContentLoaded", function () {

  document
    .getElementById("loginForm")
    .addEventListener("submit", login);

  document
    .getElementById("logoutButton")
    .addEventListener("click", logout);

  document
    .getElementById("learnerForm")
    .addEventListener("submit", addLearner);

  document
    .getElementById("learnerSearch")
    .addEventListener("input", showLearners);

  document
    .getElementById("learnerGradeFilter")
    .addEventListener("change", showLearners);

  document
    .querySelectorAll("[data-section]")
    .forEach(function (button) {

      button.addEventListener("click", function () {

        showSection(this.dataset.section);

      });

    });

  /* Start with login page */
  document.getElementById("loginPage").style.display = "flex";
  document.getElementById("appDashboard").style.display = "none";

});


/* ================= LOGIN ================= */

async function login(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Signing in...";

  try {

    const result =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {

      message.textContent =
        result.error.message;

      return;
    }

    if (!result.data.session) {

      message.textContent =
        "Login failed: no session was created.";

      return;
    }

    /* LOGIN SUCCESS */

    message.textContent = "";

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("appDashboard").style.display = "block";

    showSection("dashboard");

    /* Load data after dashboard is visible */
    loadSchool();
    loadGrades();
    loadAreas();
    loadLearners();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Login error: " + error.message;

  }

}


/* ================= SCHOOL ================= */

async function loadSchool() {

  const result =
    await db
      .from("schools")
      .select("name")
      .eq(
        "name",
        "Ngessumin Comprehensive School"
      )
      .single();

  if (result.error) {

    console.error(result.error);

    return;
  }

  document.getElementById("yearValue").textContent = "2026";

  document.getElementById("statusMessage").textContent =
    "Connected to Ngessumin Comprehensive School database.";

}


/* ================= GRADES ================= */

async function loadGrades() {

  const result =
    await db
      .from("grades")
      .select("id, grade_number")
      .order("grade_number");

  if (result.error) {

    console.error(result.error);

    return;
  }

  grades = result.data || [];

  const grade =
    document.getElementById("grade");

  const filter =
    document.getElementById("learnerGradeFilter");

  grade.innerHTML =
    '<option value="">Select grade</option>';

  filter.innerHTML =
    '<option value="">All Grades</option>';

  grades.forEach(function (item) {

    grade.innerHTML +=
      `<option value="${item.id}">
        Grade ${item.grade_number}
      </option>`;

    filter.innerHTML +=
      `<option value="${item.id}">
        Grade ${item.grade_number}
      </option>`;

  });

  document.getElementById("gradeCount").textContent =
    grades.length;

}


/* ================= LEARNING AREAS ================= */

async function loadAreas() {

  const result =
    await db
      .from("learning_areas")
      .select("id,name,code")
      .eq("active", true)
      .order("name");

  if (result.error) {

    console.error(result.error);

    return;
  }

  areas = result.data || [];

  const list =
    document.getElementById("learningAreasList");

  list.innerHTML = "";

  areas.forEach(function (area) {

    const item =
      document.createElement("div");

    item.className = "area-item";

    item.textContent = area.name;

    list.appendChild(item);

  });

  document.getElementById("areaCount").textContent =
    areas.length;

}


/* ================= LEARNERS ================= */

async function loadLearners() {

  const result =
    await db
      .from("learners")
      .select(`
        id,
        admission_number,
        full_name,
        gender,
        guardian_name,
        guardian_phone,
        admission_date,
        status,
        grade_id,
        grades (
          grade_number
        )
      `)
      .order("full_name");

  if (result.error) {

    console.error(result.error);

    return;
  }

  learners = result.data || [];

  showLearners();

  document.getElementById("learnerCount").textContent =
    learners.length;

}


/* ================= SHOW LEARNERS ================= */

function showLearners() {

  const table =
    document.getElementById("learnersTableBody");

  if (!table) return;

  const search =
    document.getElementById("learnerSearch")
      .value
      .trim()
      .toLowerCase();

  const filter =
    document.getElementById("learnerGradeFilter")
      .value;

  table.innerHTML = "";

  const list =
    learners.filter(function (learner) {

      const name =
        (learner.full_name || "").toLowerCase();

      const admission =
        (learner.admission_number || "").toLowerCase();

      const matchesSearch =
        name.includes(search) ||
        admission.includes(search);

      const matchesGrade =
        !filter ||
        learner.grade_id === filter;

      return matchesSearch && matchesGrade;

    });

  if (list.length === 0) {

    table.innerHTML = `
      <tr>
        <td colspan="6">
          No learners found.
        </td>
      </tr>
    `;

    return;
  }

  list.forEach(function (learner) {

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHTML(learner.admission_number)}</td>
      <td>${escapeHTML(learner.full_name)}</td>
      <td>${escapeHTML(learner.gender || "")}</td>
      <td>Grade ${
        learner.grades
          ? learner.grades.grade_number
          : ""
      }</td>
      <td>${escapeHTML(learner.guardian_name || "")}</td>
      <td>${escapeHTML(learner.status || "")}</td>
    `;

    table.appendChild(row);

  });

}


/* ================= ADD LEARNER ================= */

async function addLearner(event) {

  event.preventDefault();

  const message =
    document.getElementById("learnerMessage");

  const admissionNumber =
    document.getElementById("admissionNumber")
      .value.trim();

  const fullName =
    document.getElementById("fullName")
      .value.trim();

  const gender =
    document.getElementById("gender").value;

  const gradeId =
    document.getElementById("grade").value;

  const guardianName =
    document.getElementById("guardianName")
      .value.trim();

  const guardianPhone =
    document.getElementById("guardianPhone")
      .value.trim();

  const admissionDate =
    document.getElementById("admissionDate").value;

  const status =
    document.getElementById("learnerStatus").value;

  if (!admissionNumber || !fullName || !gradeId) {

    message.textContent =
      "Please enter admission number, full name and grade.";

    return;
  }

  message.textContent =
    "Saving learner...";

  const schoolResult =
    await db
      .from("schools")
      .select("id")
      .eq(
        "name",
        "Ngessumin Comprehensive School"
      )
      .single();

  if (schoolResult.error) {

    message.textContent =
      "School error: " +
      schoolResult.error.message;

    return;
  }

  const result =
    await db
      .from("learners")
      .insert({

        school_id:
          schoolResult.data.id,

        admission_number:
          admissionNumber,

        full_name:
          fullName,

        gender:
          gender || null,

        grade_id:
          gradeId,

        guardian_name:
          guardianName || null,

        guardian_phone:
          guardianPhone || null,

        admission_date:
          admissionDate || null,

        status:
          status || "Active"

      });

  if (result.error) {

    message.textContent =
      "Error: " +
      result.error.message;

    return;
  }

  message.textContent =
    "Learner added successfully.";

  document
    .getElementById("learnerForm")
    .reset();

  await loadLearners();

}


/* ================= NAVIGATION ================= */

function showSection(section) {

  document
    .querySelectorAll(".section")
    .forEach(function (item) {

      item.classList.remove("active");

    });

  const target =
    document.getElementById(section);

  if (target) {

    target.classList.add("active");

  }

}


/* ================= LOGOUT ================= */

async function logout() {

  await db.auth.signOut();

  document.getElementById("appDashboard").style.display = "none";

  document.getElementById("loginPage").style.display = "flex";

}


/* ================= HTML SECURITY ================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>
